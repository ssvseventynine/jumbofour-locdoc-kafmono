# Server Port
server.port=8080

# Database Configuration (Hibernate & MySQL)
# Looks for DB_HOST, DB_NAME, DB_USER, and DB_PASS variables; falls back to your local Windows settings if missing
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:jumbofour_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Sidhant@123}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration
# Looks for KAFKA_HOST variable; falls back to your local localhost:9092 if missing
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost:9092}
spring.kafka.consumer.group-id=jumbofour-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer